name: Deploy QA release (Manual)

on:
  workflow_dispatch:
  push: 
    branches: 
      - 'test'
    
jobs:
  build: 
    runs-on: ubuntu-latest
     
    steps:
      - name: CheckOut repository ⚓
        uses: actions/checkout@v3

      - name: Set up JDK 17 🚥
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java version 👀
        run: java -version

      - name: Create google-services.json 🤖
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > $GITHUB_WORKSPACE/SuperTool/app/google-services.json
          cat $GITHUB_WORKSPACE/SuperTool/app/google-services.json

      - name: Build the code 🚀
        run: cd SuperTool && ./gradlew build

      - name: Upload APK to Firebase App Distribution 
        uses: FirebaseAppDistribution/upload-apk@v1 
        with: 
          token: ${{ secrets.FIREBASE_APP_DISTRIBUTION_TOKEN }} 
          app_id: ${{ secrets.FIREBASE_APP_ID }} 
          file: 'app/build/outputs/apk/release/app-release.apk'
